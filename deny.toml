# Fails on known vulnerabilities and yanked crates.
[advisories]
version = 2
yanked = "deny"
# zip 8 is reachable only through the vendored Chromium crate's optional `fetcher` feature, which no workspace crate enables.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "optional fetcher feature is not enabled" },
    { id = "RUSTSEC-2026-0368", reason = "optional fetcher feature is not enabled" },
    { id = "RUSTSEC-2026-0369", reason = "optional fetcher feature is not enabled" },
    { id = "RUSTSEC-2026-0429", reason = "optional fetcher feature is not enabled" },
]

# Fails on licenses outside the allow list.
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

# Duplicate versions and wildcard requirements are not gated.
[bans]
multiple-versions = "allow"
wildcards = "allow"

# Only crates.io is an accepted source.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
