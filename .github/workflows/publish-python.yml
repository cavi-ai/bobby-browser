name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  # Publishes an existing release tag (for example v0.16.0, cut before this
  # workflow existed). dry_run stops after the build.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Build and verify without upload
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  group: publish-pypi-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-python-sdk:
    runs-on: ubuntu-latest
    # Named in the PyPI trusted publisher, so it is part of the OIDC claim PyPI
    # matches. The trusted publisher for `bobby-browser` is cavi-ai /
    # bobby-browser, workflow filename `publish-python.yml`, environment
    # `pypi`: renaming this file or dropping `environment:` stops publishing
    # until the trusted publisher is edited to match.
    environment: pypi
    permissions:
      contents: read
      # The whole of the publish credential: PyPI exchanges this OIDC token for
      # a short-lived upload token. No PyPI token is stored in this repository.
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
    steps:
      - name: Require a release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${RELEASE_TAG} is not a vX.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify every artifact carries one version
        run: python3 scripts/check-version-agreement.py

      - name: Match the release tag to the package version
        run: |
          set -euo pipefail
          PKG_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/python-sdk/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::release tag ${RELEASE_TAG} does not match package version ${PKG_VERSION}"
            exit 1
          fi

      - name: Unit tests
        run: python3 -m unittest discover -s packages/python-sdk/tests

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install --quiet build twine
          "$RUNNER_TEMP/build-venv/bin/python" -m build --outdir dist packages/python-sdk
          "$RUNNER_TEMP/build-venv/bin/twine" check --strict dist/*

      # A PyPI version cannot be re-uploaded once published; `skip-existing`
      # makes a re-run of the same tag a no-op instead of a failure.
      - name: Publish
        if: ${{ env.PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
