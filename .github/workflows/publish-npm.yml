name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cavi-ai/bobby-browser test
      - name: Dry-run pack
        working-directory: packages/typescript-sdk
        run: pnpm build && npm pack --dry-run
      - name: Publish
        working-directory: packages/typescript-sdk
        # `setup-node` with `registry-url` writes an .npmrc pointing at
        # ${NODE_AUTH_TOKEN}. Without that env var the token is empty and npm
        # answers `404 Not Found - PUT` rather than 401, which reads like a
        # missing package. This workflow had never once succeeded — five runs,
        # five failures — and @cavi-ai/bobby-browser@0.3.1 reached the registry
        # by hand.
        #
        # `id-token: write` stays: npm prefers OIDC trusted publishing when the
        # package has a trusted publisher configured, and falls back to this
        # token when it does not.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
