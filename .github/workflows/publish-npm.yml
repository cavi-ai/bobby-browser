name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cavi-ai/bobby-browser test
      - name: Dry-run pack
        working-directory: packages/typescript-sdk
        run: pnpm build && npm pack --dry-run
      # Trusted publishing exchanges the job's OIDC identity for a
      # short-lived credential. npm is restricting 2FA-bypass tokens, and the
      # stored token now fails with EOTP, so there is no token path left for
      # CI. Requires npm >= 11.5.1, which is newer than the version bundled
      # with Node 22.
      - name: Use an npm with OIDC support
        run: npm install -g npm@latest
      - name: Publish
        working-directory: packages/typescript-sdk
        run: npm publish --access public
