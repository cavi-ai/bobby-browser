name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust · build · test · lint
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        # Logic/contract tests. Chromium-dependent tests are #[ignore]d here and
        # run live in the `chromium` job below.
        run: cargo test --workspace --locked

  chromium:
    name: chromium · live browser tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      BOBBY_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 150.0.7871.187
          install-dependencies: true

      - name: Locate Chrome
        run: |
          BIN="$(find /opt/hostedtoolcache -name chrome -type f | head -n 1)"
          echo "BOBBY_CHROME_EXECUTABLE=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
          echo "resolved=$(readlink -f "$BIN")"
          "$(readlink -f "$BIN")" --version
          "$(readlink -f "$BIN")" --headless --no-sandbox --dump-dom about:blank | head -c 200

      - name: Chrome diagnostics
        run: |
          echo "executable=$BOBBY_CHROME_EXECUTABLE"
          ls -la "$BOBBY_CHROME_EXECUTABLE" || true
          ldd "$BOBBY_CHROME_EXECUTABLE" | grep "not found" || true

      - name: Worker live tests
        run: cargo test -p worker-pool --test chromium_worker --locked -- --ignored --test-threads=1

      - name: Runtime live tests
        run: >-
          cargo test -p runtime-tests --locked --
          --test adaptive_http
          --test agentic_interaction
          --test browser_vertical_slice
          --test checkpoint_recovery
          --test intent_dismiss_obstruction_workflow
          --test intent_extract_workflow
          --test intent_follow_workflow
          --test intent_form_workflow
          --test intent_vision_escalation
          --test interface_capacity
          --test interface_recovery
          --test interface_security
          --ignored --test-threads=1

      - name: Conformance live tests
        run: cargo test -p interface-conformance --test javascript_evaluation --locked -- --ignored --test-threads=1

  node:
    name: node · typescript · docs
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript SDK
        run: pnpm --filter @cavi-ai/bobby-browser test

      - name: Firefox companion
        run: pnpm --filter @bobby-browser/firefox-companion test

      - name: Interface conformance
        # Browser-driven conformance (matrix, playwright, puppeteer) needs a real
        # Chrome and runs locally; this gate covers typecheck and the browser-free tests.
        run: pnpm --filter @bobby-browser/interface-conformance test:unit

      - name: Docs artifact
        run: |
          pnpm docs:build
          pnpm docs:verify
          pnpm docs:test
