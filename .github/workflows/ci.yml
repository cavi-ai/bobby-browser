name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust · build · test · lint
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    env:
      BOBBY_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Build the Northstar browser app for workspace tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cavi-ai/bobby-gauntlet build

      - name: Install Chrome for workspace tests
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 150.0.7871.124
          install-dependencies: true

      - name: Locate Chrome for workspace tests
        run: |
          BIN="$(find /opt/hostedtoolcache -name chrome -type f | head -n 1)"
          echo "BOBBY_CHROME_EXECUTABLE=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
          "$(readlink -f "$BIN")" --version

      - name: Test
        # Workspace tests include the mandatory Northstar browser journeys.
        # The chromium job below runs them again against the pinned release browser.
        run: cargo test --workspace --locked

      - name: Version and naming agreement
        # One tag ships binaries, npm, and the crate, so a version that
        # disagrees between manifests ships a mislabelled artifact. npm reached
        # 0.3.1 while the last sdk-v* tag was 0.3.0 because nothing checked.
        run: python3 scripts/check-version-agreement.py

      - name: Browser-free ignored tests
        # `default_profile_golden` is #[ignore]d because it is a golden lock,
        # not because it needs a browser: it diffs the committed Firefox
        # companion profile against `create_session` output. Nothing else in
        # the workspace catches a drift between those two.
        run: cargo test -p fingerprinting --test default_profile_golden --locked -- --ignored

  windows:
    name: windows · build shipped binary
    # Every v* tag builds bobby for windows-msvc in release-binaries, but CI was
    # ubuntu-only. A #[cfg(unix)]-gated exec_mcp_stdio therefore reached the
    # v0.4.0 tag and broke the Windows binary after the release was cut. Compile
    # the same crate the release ships so the break lands on the PR instead.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build -p bobby-browser --locked

  chromium:
    name: chromium · live browser tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      BOBBY_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Build and test the Northstar browser app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cavi-ai/bobby-gauntlet test
          pnpm --filter @cavi-ai/bobby-gauntlet build

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 150.0.7871.124
          install-dependencies: true

      - name: Locate Chrome
        run: |
          BIN="$(find /opt/hostedtoolcache -name chrome -type f | head -n 1)"
          echo "BOBBY_CHROME_EXECUTABLE=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
          echo "resolved=$(readlink -f "$BIN")"
          "$(readlink -f "$BIN")" --version
          "$(readlink -f "$BIN")" --headless --no-sandbox --dump-dom about:blank | head -c 200

      - name: Chrome diagnostics
        run: |
          echo "executable=$BOBBY_CHROME_EXECUTABLE"
          ls -la "$BOBBY_CHROME_EXECUTABLE" || true
          ldd "$BOBBY_CHROME_EXECUTABLE" | grep "not found" || true

      - name: Worker live tests
        run: cargo test -p worker-pool --test chromium_worker --locked -- --ignored --test-threads=1

      - name: Northstar end-to-end release gate
        run: cargo test -p runtime-tests --locked --test modern_gauntlet_e2e -- --test-threads=1

      - name: Upload Northstar failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: modern-gauntlet-evidence
          path: target/modern-gauntlet-artifacts
          if-no-files-found: warn

      - name: Runtime live tests
        run: >-
          cargo test -p runtime-tests --locked
          --test adaptive_http
          --test agentic_interaction
          --test browser_vertical_slice
          --test checkpoint_recovery
          --test context_privacy
          --test intent_dismiss_obstruction_workflow
          --test intent_extract_workflow
          --test intent_follow_workflow
          --test intent_form_workflow
          --test intent_vision_escalation
          --test interface_capacity
          --test interface_recovery
          --test interface_security
          -- --ignored --test-threads=1

      - name: Conformance live tests
        run: >-
          cargo test -p interface-conformance --locked
          --test javascript_evaluation
          --test mcp_live
          -- --ignored --test-threads=1

      - name: Worker-pool live tests
        run: >-
          cargo test -p worker-pool --locked
          --test fingerprint_conformance
          --test orphan_reap
          -- --ignored --test-threads=1

  firefox:
    name: firefox · live companion tests
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Build the companion extension
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cavi-ai/bobby-firefox-companion build

      - name: Install Firefox
        uses: browser-actions/setup-firefox@latest

      - name: Prepare the dedicated profile and native host
        run: |
          cargo build -p bobby-browser -p runtime-tests --locked
          PROFILE="$RUNNER_TEMP/bobby-firefox-profile"
          mkdir -p "$PROFILE"
          echo "BOBBY_FIREFOX_BIN=$(command -v firefox)" >> "$GITHUB_ENV"
          echo "BOBBY_FIREFOX_PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "BOBBY_COMPANION_EXTENSION=$GITHUB_WORKSPACE/packages/firefox-companion/dist" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.mozilla/native-messaging-hosts"
          target/debug/bobby install-firefox-native-host \
            --wrapper "$GITHUB_WORKSPACE/target/firefox-companion-proof/firefox-native-host" \
            --manifest "$HOME/.mozilla/native-messaging-hosts/com.bobby_browser.companion.json" \
            --cli "$GITHUB_WORKSPACE/target/debug/bobby" \
            --descriptor "$GITHUB_WORKSPACE/target/firefox-companion-proof/native-host-descriptor.json"

      - name: Firefox live tests
        run: >-
          xvfb-run -a cargo test -p runtime-tests --locked
          --test firefox_companion
          --test behavioral_firefox
          --test fingerprint_firefox
          -- --ignored --test-threads=1

  node:
    name: node · typescript · docs
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript SDK
        run: pnpm --filter @cavi-ai/bobby-browser test

      - name: Firefox companion
        run: pnpm --filter @cavi-ai/bobby-firefox-companion test

      - name: Interface conformance
        # Browser-driven conformance (matrix, playwright, puppeteer) needs a real
        # Chrome and runs locally; this gate covers typecheck and the browser-free tests.
        run: pnpm --filter @cavi-ai/bobby-interface-conformance test:unit

      - name: Docs artifact
        run: |
          pnpm docs:build
          pnpm docs:verify
          pnpm docs:test
