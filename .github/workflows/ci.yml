name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust · build · test · lint
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        # Chromium-dependent tests are #[ignore]d and skipped here; they run in the
        # certification job locally. This gate covers all logic/contract tests.
        run: cargo test --workspace --locked

  node:
    name: node · typescript · docs
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript SDK
        run: pnpm --filter @cavi-ai/bobby-browser test

      - name: Firefox companion
        run: pnpm --filter @bobby-browser/firefox-companion test

      - name: Interface conformance
        # Browser-driven conformance (matrix, playwright, puppeteer) needs a real
        # Chrome and runs locally; this gate covers typecheck and the browser-free tests.
        run: pnpm --filter @bobby-browser/interface-conformance test:unit

      - name: Docs artifact
        run: |
          pnpm docs:build
          pnpm docs:verify
          pnpm docs:test
