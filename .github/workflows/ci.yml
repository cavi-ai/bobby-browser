name: CI

# Runs on every pull request, a release tag, or by hand. Every job finishes
# within 15 minutes; a check that cannot does not belong here.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info: smaller and faster builds, and the target fits the runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Lint and tests run side by side: one job doing both from a cold cache
  # outlasts 15 minutes once the cache is saved.
  lint:
    name: rust · fmt · clippy
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  rust:
    name: rust · test
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOBBY_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # The runner image already carries Chrome's libraries; skipping apt keeps
      # a slow package mirror out of the job.
      - name: Install Chrome for workspace tests
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 150.0.7871.124
          install-dependencies: false

      - name: Locate Chrome for workspace tests
        run: |
          BIN="$(find /opt/hostedtoolcache -name chrome -type f | head -n 1)"
          echo "BOBBY_CHROME_EXECUTABLE=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
          "$(readlink -f "$BIN")" --version

      - name: Test
        run: cargo test --workspace --locked

      - name: Version and naming agreement
        # One tag ships binaries, npm, and the crate, so a version that
        # disagrees between manifests ships a mislabelled artifact.
        run: |
          python3 -m unittest scripts/test_check_version_agreement.py
          python3 scripts/check-version-agreement.py
          python3 -m unittest scripts/test_homebrew_release.py
          python3 -m unittest scripts/test_amo_signed_companion.py

      - name: Release installer regressions
        run: scripts/install-release.test.sh

      - name: Vision server
        # The vision server and its providers ship with every release.
        working-directory: scripts/vision-mlx
        run: python3 -m unittest test_provider_base.py test_v1_provider.py test_vision_server.py

      - name: Profile golden
        # `default_profile_golden` diffs the committed Firefox companion
        # profile against `create_session` output; nothing else catches that drift.
        run: cargo test -p fingerprinting --test default_profile_golden --locked -- --ignored

  node:
    name: node · typescript · docs
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript SDK
        run: pnpm --filter @cavi-ai/bobby-browser test

      - name: Firefox companion
        run: pnpm --filter @cavi-ai/bobby-firefox-companion test

      - name: Python SDK
        run: python3 -m unittest discover -s packages/python-sdk/tests

      - name: Docs artifact
        run: |
          pnpm docs:build
          pnpm docs:verify
          pnpm docs:test
