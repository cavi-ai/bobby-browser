name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to attach assets to, e.g. v0.3.0
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
          - os: macos-15
            target: aarch64-apple-darwin
            asset_os: macos
            asset_arch: arm64
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 macOS image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: macos
            asset_arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release bobby
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p bobby-browser --target "${{ matrix.target }}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(python3 -c "import pathlib,re; m=re.search(r'\[workspace\.package\][^[]*?\bversion\s*=\s*\"([^\"]+)\"', pathlib.Path('Cargo.toml').read_text(), re.S); print(m.group(1))")"
          fi
          STAGE="bobby-browser-${VERSION}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          mkdir -p "$STAGE"
          if [[ "${{ matrix.asset_os }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/bobby.exe" "$STAGE/bobby.exe"
            tar -a -cf "${STAGE}.zip" "$STAGE"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/bobby" "$STAGE/bobby"
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "STAGE_DIR=${STAGE}" >> "$GITHUB_ENV"
      - name: Smoke bobby --help
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.asset_os }}" == "windows" ]]; then
            "./${STAGE_DIR}/bobby.exe" --help
          else
            "./${STAGE_DIR}/bobby" --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bobby-browser-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    # Uploading assets needs write here even though the workflow already
    # declares it, matching publish-docs.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # `gh release upload` touches assets only. Actions that PATCH the release
      # need `update-a-release`, which this token is not granted, and would
      # overwrite the body written from CHANGELOG.md.
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no built assets to upload"
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
