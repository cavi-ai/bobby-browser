name: Publish crates

on:
  push:
    tags:
      - "v*"
  # Publishes an existing release tag. dry_run stops after the dry-run publish.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Verify without publishing
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  group: publish-crates-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Named in the crates.io trusted publisher for `bobby-browser-client`
    # (cavi-ai / bobby-browser, workflow `publish-crates.yml`, environment
    # `crates`): renaming this file or the environment stops publishing.
    environment: crates
    permissions:
      contents: read
      # crates.io exchanges this OIDC token for a short-lived publish token.
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
    steps:
      - name: Require a release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${RELEASE_TAG} is not a vX.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build installable binary
        run: cargo build --release -p bobby-browser

      - name: Verify publish path policy
        run: |
          set -euo pipefail
          python3 scripts/check-publish-path-versions.py

      - name: Verify every artifact carries one version
        run: |
          set -euo pipefail
          python3 scripts/check-version-agreement.py

      # Runs on every trigger, so a broken manifest is caught without claiming
      # a name on crates.io.
      - name: Dry-run publish
        run: |
          set -euo pipefail
          cargo publish -p bobby-browser-client --dry-run

      - name: Authenticate to crates.io
        if: env.PUBLISH == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish -p bobby-browser-client
