name: Publish crates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build installable binary
        run: cargo build --release -p bobby-browser

      - name: Verify publish path policy
        run: |
          set -euo pipefail
          python3 scripts/check-publish-path-versions.py

      - name: Verify every artifact carries one version
        run: |
          set -euo pipefail
          python3 scripts/check-version-agreement.py

      # Pre-flight on every trigger, including workflow_dispatch, so a broken
      # manifest is caught without claiming a name on crates.io.
      - name: Dry-run publish
        run: |
          set -euo pipefail
          cargo publish -p bobby-browser-client --dry-run

      # Only on a version tag. `workflow_dispatch` stops at the dry run, so the
      # manual trigger stays a safe rehearsal — publishing to crates.io is
      # irreversible and a name cannot be reclaimed.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p bobby-browser-client
