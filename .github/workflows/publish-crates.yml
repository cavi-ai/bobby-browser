name: Publish crates (dry-run)

on:
  workflow_dispatch:
  push:
    tags:
      - "crate-v*"

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build installable binary
        run: cargo build --release -p bobby-browser
      - name: Dry-run publish Rust SDK
        run: |
          set -euo pipefail
          echo "::group::dry-run bobby-browser-client"
          cargo publish -p bobby-browser-client --dry-run
          echo "::endgroup::"
      - name: Verify publish path policy
        run: |
          set -euo pipefail
          python3 scripts/check-publish-path-versions.py
