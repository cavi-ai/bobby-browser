<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bobby Companion</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 12px;
        min-width: 300px;
        color: #1a1a1a;
        background: #f7f7f5;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      section {
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: #888;
        margin-bottom: 4px;
        letter-spacing: 0.02em;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge-paired {
        background: #d4edda;
        color: #155724;
      }
      .badge-unpaired {
        background: #fff3cd;
        color: #856404;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      label input:disabled + span,
      label:has(input:disabled) {
        cursor: default;
        opacity: 0.7;
      }
      .status {
        margin-top: 6px;
        color: #555;
        font-size: 12px;
        white-space: pre-line;
      }
      .meta {
        font-size: 11px;
        color: #777;
      }
      #debug {
        font-size: 11px;
        color: #666;
        border-top: 1px solid #e0e0e0;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Bobby Companion</h1>

    <section id="connection">
      <div class="section-title">Connection</div>
      <div class="status">Loading…</div>
    </section>

    <section id="session">
      <div class="section-title">Session</div>
      <div class="status">—</div>
    </section>

    <section id="fingerprint">
      <div class="section-title">Fingerprint</div>
      <label>
        <input id="toggle" type="checkbox" />
        <span>Enabled</span>
      </label>
      <p id="fingerprint-status" class="status">Loading…</p>
    </section>

    <section>
      <div class="section-title">Humanize</div>
      <p id="humanize-status" class="status">—</p>
    </section>

    <section id="debug">
      <div class="section-title">Debug</div>
      <div class="status">—</div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
