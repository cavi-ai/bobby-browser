<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>image challenge</title>
<style>
body { margin: 0; font: 14px Roboto, Helvetica, Arial, sans-serif; background: #fff; }
.prompt { background: #1a73e8; color: #fff; padding: 18px 16px; }
.prompt b { display: block; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
.tile { height: 120px; border: 0; padding: 0; }
.footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid #ddd; }
.footer button { background: #1a73e8; color: #fff; border: 0; border-radius: 2px; padding: 10px 18px; font: 600 14px Roboto, Arial, sans-serif; }
</style></head>
<body>
<div class="prompt">Select all images with<b>traffic lights</b>Click verify once there are none left.</div>
<div class="grid">
  <button class="tile" aria-label="Image 1" style="background:linear-gradient(#7fa7c9 55%,#5d6b5a 55%)"></button>
  <button class="tile" aria-label="Image 2" style="background:radial-gradient(circle at 50% 30%,#e33 10%,transparent 11%),radial-gradient(circle at 50% 55%,#fc3 10%,transparent 11%),linear-gradient(90deg,#9bb 40%,#222 40% 60%,#9bb 60%)"></button>
  <button class="tile" aria-label="Image 3" style="background:linear-gradient(#a9c1d9 60%,#777 60%)"></button>
  <button class="tile" aria-label="Image 4" style="background:linear-gradient(135deg,#6a8 0 50%,#486 50%)"></button>
  <button class="tile" aria-label="Image 5" style="background:linear-gradient(#bcd 50%,#555 50%)"></button>
  <button class="tile" aria-label="Image 6" style="background:radial-gradient(circle at 50% 70%,#3c3 10%,transparent 11%),linear-gradient(90deg,#abc 40%,#222 40% 60%,#abc 60%)"></button>
  <button class="tile" aria-label="Image 7" style="background:linear-gradient(#ccb 45%,#8a7f6a 45%)"></button>
  <button class="tile" aria-label="Image 8" style="background:linear-gradient(160deg,#8ab 0 40%,#996 40%)"></button>
  <button class="tile" aria-label="Image 9" style="background:linear-gradient(#9ab 65%,#444 65%)"></button>
</div>
<div class="footer"><span aria-hidden="true">&#8635; &#127911; &#9432;</span><button>Verify</button></div>
</body></html>
