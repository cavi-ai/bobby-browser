<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Search</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header><span class="brand">Fieldnote</span><span style="flex:1"><input type="search" aria-label="Search" placeholder="Search notes" style="max-width:480px"></span><button>Search</button></header>
<main class="layout">
  <aside><p class="eyebrow">Filters</p>
    <p><input type="checkbox" id="f-mine"> <label for="f-mine" style="display:inline;font-weight:400">Only my notes</label></p>
    <p><input type="checkbox" id="f-shared"> <label for="f-shared" style="display:inline;font-weight:400">Shared with me</label></p>
    <p><input type="checkbox" id="f-week"> <label for="f-week" style="display:inline;font-weight:400">Edited this week</label></p></aside>
  <section>
    <p class="muted">About 1,280 results</p>
    <div class="card"><a href="/n/1">Quarterly planning notes</a><p class="muted">Edited 2 days ago</p></div>
    <div class="card"><a href="/n/2">Vendor onboarding checklist</a><p class="muted">Edited last week</p></div>
    <div class="card"><a href="/n/3">Interview loop for platform roles</a><p class="muted">Edited in June</p></div>
  </section>
</main>
</body></html>
