<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header><span class="brand">Harbor Desk</span><nav><a href="/pricing">Pricing</a><a href="/docs">Docs</a><a href="/support">Support</a></nav></header>
<main>
  <button class="secondary" style="position:fixed;left:40px;top:120px;width:132px;height:38px">Contact sales</button>
  <div class="card" style="max-width:420px;margin:40px auto">
    <h1 style="margin-top:0">Sign in to your workspace</h1>
    <p class="muted">Use the email address you registered with.</p>
    <form>
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@company.test">
      <label for="password">Password</label>
      <input id="password" type="password">
      <div class="row" style="margin-top:16px">
        <button type="submit">Sign in</button>
        <a href="/reset">Forgot password?</a>
      </div>
      <p style="margin-top:28px"><input type="checkbox" id="remember"> <label for="remember" style="display:inline;font-weight:400">Keep me signed in</label></p>
    </form>
    <p class="muted">New here? <a href="/register">Create an account</a></p>
  </div>
</main>
</body></html>
