[package]
name = "bobby-browser"
description = "Bobby Browser automation runtime CLI (bobby)"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "mcp"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
autobins = false

[lib]
name = "cli"
path = "src/main.rs"

[[bin]]
name = "bobby"
path = "src/bin/cli.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dialoguer.workspace = true
dirs.workspace = true
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
artifact-store.workspace = true
auth-broker.workspace = true
context-store.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
broker.workspace = true
config.workspace = true
node-registry.workspace = true
companion-protocol.workspace = true
companion-core.workspace = true
firefox-companion.workspace = true
intent-engine.workspace = true
workflow-journal.workspace = true
task-scheduler.workspace = true
observability.workspace = true
mcp-gateway.workspace = true
libc = "0.2"
serde_json.workspace = true
serde.workspace = true
types.workspace = true
uuid.workspace = true
url.workspace = true
worker-pool.workspace = true
vision-proxy.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
tempfile.workspace = true
