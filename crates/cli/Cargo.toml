[package]
name = "bobby-browser"
description = "Bobby Browser automation runtime CLI (bobby)"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "mcp"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
autobins = false

[lib]
name = "cli"
path = "src/main.rs"

[[bin]]
name = "bobby"
path = "src/bin/cli.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dialoguer.workspace = true
dirs.workspace = true
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
artifact-store = { path = "../artifact-store", version = "0.12.0" }
auth-broker = { path = "../auth-broker", version = "0.12.0" }
context-store = { path = "../context-store", version = "0.12.0" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
broker = { path = "../broker", version = "0.12.0" }
config = { path = "../config", version = "0.12.0" }
node-registry = { path = "../node-registry", version = "0.12.0" }
companion-protocol = { path = "../companion-protocol", version = "0.12.0" }
companion-core = { path = "../companion-core", version = "0.12.0" }
firefox-companion = { path = "../firefox-companion", version = "0.12.0" }
intent-engine = { path = "../intent-engine", version = "0.12.0" }
workflow-journal = { path = "../workflow-journal", version = "0.12.0" }
task-scheduler = { path = "../task-scheduler", version = "0.12.0" }
observability = { path = "../observability", version = "0.12.0" }
mcp-gateway = { path = "../mcp-gateway", version = "0.12.0" }
libc = "0.2"
serde_json.workspace = true
serde.workspace = true
types = { path = "../types", version = "0.12.0" }
uuid.workspace = true
url.workspace = true
worker-pool = { path = "../worker-pool", version = "0.12.0" }
vision-proxy = { path = "../vision-proxy", version = "0.12.0" }
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
tempfile.workspace = true
