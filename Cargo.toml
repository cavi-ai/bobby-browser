[workspace]
members = [
  "crates/broker",
  "crates/cli",
  "crates/bobby-browser-client",
  "crates/config",
  "crates/types",
  "crates/skill-runtime",
  "crates/companion-protocol",
  "crates/companion-core",
  "crates/firefox-companion",
  "crates/behavioral-engine",
  "crates/task-scheduler",
  "crates/fingerprinting",
  "crates/node-registry",
  "crates/acp-gateway",
  "crates/interface-core",
  "crates/sdk-core",
  "crates/session-manager",
  "crates/page-runtime",
  "crates/network-engine",
  "crates/dom-engine",
  "crates/intent-engine",
  "crates/js-engine",
  "crates/artifact-store",
  "crates/checkpoint-store",
  "crates/workflow-journal",
  "crates/worker-pool",
  "crates/observability",
  "crates/cdp-gateway",
  "crates/mcp-gateway",
  "crates/test-site",
  "crates/vision-proxy",
  "crates/runtime-tests",
  "crates/interface-conformance",
  "crates/release-gates",
  "vendor/chromiumoxide",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "MIT"
authors = ["Sasan Sotoodehfar"]
repository = "https://github.com/cavi-ai/bobby-browser"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
agent-client-protocol = "2"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
chromiumoxide = { package = "bobby-chromiumoxide", version = "0.9.1", path = "vendor/chromiumoxide" }
futures = "0.3"
jsonschema = "0.49"
schemars = { version = "1", features = ["derive", "uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
rustix = { version = "1.1.4", features = ["fs"] }
scraper = "0.27"
sha2 = "0.10"
subtle = "2"
cookie = "0.18"
dialoguer = "0.11"
dirs = "6"
encoding_rs = "0.8"
futures-util = "0.3"
getrandom = "0.4"
rand = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tempfile = "3"
toml = "1.1"
toml_edit = "0.22"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "macro-diagnostics"] }

# Build-artifact budget.
#
# `target/` reached 195 GB on this checkout: 111 GB of `debug/deps`, 71 GB of
# `debug/incremental`, 8.5 GB of `debug/examples`. 93% of the `.rlib` files in
# `deps` had not been touched in a day — cargo never garbage-collects stale
# artifacts, so every dependency and every test binary accumulates a copy per
# code change, at full DWARF debug info, forever.
#
# Two settings, both deliberate:
#
# `debug = "line-tables-only"` keeps file and line numbers in backtraces —
# everything a failing test or a panic needs — while dropping the full type and
# variable DWARF that only an interactive debugger uses. That information is
# the bulk of `deps`. Anyone who needs it can build with
# `RUSTFLAGS="-C debuginfo=2"` for a session.
#
# `incremental = false` removes the 71 GB cache, and is also what makes
# `sccache` work: sccache does not cache incrementally-compiled crates, so with
# incremental on it sits at a 0% hit rate doing nothing. Trading a
# per-worktree, per-branch cache for a shared content-addressed one is the
# better deal here, because work happens across many worktrees where the
# incremental cache never carried over anyway.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Test binaries inherit `dev` for their own code but not for dependencies;
# setting both keeps the whole graph consistent.
[profile.test]
debug = "line-tables-only"
incremental = false
