[workspace]
members = [
  "crates/broker",
  "crates/cli",
  "crates/config",
  "crates/types",
  "crates/sdk-core",
  "crates/session-manager",
  "crates/page-runtime",
  "crates/network-engine",
  "crates/dom-engine",
  "crates/js-engine",
  "crates/artifact-store",
  "crates/checkpoint-store",
  "crates/workflow-journal",
  "crates/worker-pool",
  "crates/tracing",
  "crates/cdp-gateway",
  "crates/mcp-gateway",
  "crates/test-site",
  "crates/runtime-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["OpenAI"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.9.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[patch.crates-io]
chromiumoxide = { path = "vendor/chromiumoxide" }
