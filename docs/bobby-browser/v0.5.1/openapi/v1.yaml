openapi: 3.1.0
info:
  title: bobby-browser HTTP API
  version: "0.5.1"
  summary: Authenticated broker routes under /v1/*
  description: |
    Browser automation runtime for agents. Prefer MCP for tool discovery; this
    document catalogs HTTP `/v1/*` for HTTP clients.

    Every broker `/v1/*` request (except `/v1/mcp`) needs headers Authorization
    (Bearer), x-interface-version, x-correlation-id, and x-deadline. Mutating
    POSTs also take idempotency-key. `/v1/mcp` uses bearer-only auth (no
    per-request interface headers).

    Any authenticated `/v1/*` route can return **408** when `x-deadline` elapses
    and **500** for internal failures (`InterfaceErrorBody`). Command outcomes
    map additionally to 403/409/422/429/503 — see `POST /v1/commands`.

    `Retry-After` is always integer **seconds**. Millisecond hints are rounded
    up (`ceil(ms/1000)`, minimum 1). `retryableFailure` (503) uses a fixed
    default of 1 second today — the outcome has no per-failure ms field yet.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:7777
    description: Local bobby serve default (config.toml http.port)
tags:
  - name: runtime
  - name: sessions
  - name: pages
  - name: forms
  - name: commands
  - name: recovery
  - name: events
  - name: artifacts
  - name: jobs
  - name: principals
  - name: mcp
  - name: health
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
  /v1/runtime:
    get:
      operationId: getRuntime
      tags: [runtime]
      summary: Runtime info
      description: Requires capability `session:read`.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: Runtime snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions
      description: Requires `session:read`. Full array (no pagination).
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create session
      description: Requires `session:write`.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            examples:
              denyByDefault:
                value:
                  profile: default
                  executionPolicy:
                    javascriptEvaluation: false
                    visionAssist: false
                    fingerprint: false
                    humanize: false
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/sessions/{session}:
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete session
      description: Requires `session:write`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/pages:
    post:
      operationId: openPage
      tags: [pages]
      summary: Open page
      description: |
        Requires `page:write`. Body is `OpenPageRequest`: snake_case
        `session_id` only (documented camelCase exception). Navigation URL is
        not accepted here — use `POST /v1/commands` / MCP `page_open` /
        navigate intents after the blank page opens.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPageRequest"
            examples:
              open:
                value:
                  session_id: "10000000-0000-4000-8000-000000000001"
      responses:
        "200":
          description: Opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/DeadlineExceeded"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{session}/pages/{page}/forms:
    get:
      operationId: getFormSnapshot
      tags: [forms]
      summary: Form snapshot
      description: Requires `page:read`. Same contract as MCP `form_snapshot`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/PageId"
        - name: maxControls
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 512
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: FormSnapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/commands:
    post:
      operationId: submitCommand
      tags: [commands]
      summary: Submit command envelope
      description: |
        Requires `browser:mutate` plus nested caps for upload / download / JS /
        intents. Body is CommandEnvelope (`schemaVersion: 2`).
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: CommandOutcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOutcome"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Missing capability, or command outcome `policyDenied`
            (body is CommandOutcome when from the executor).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InterfaceErrorBody"
                  - $ref: "#/components/schemas/CommandOutcome"
        "408":
          $ref: "#/components/responses/DeadlineExceeded"
        "409":
          description: |
            Idempotency conflict, or command outcome `needsReconciliation`
            (body is CommandOutcome when from the executor).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InterfaceErrorBody"
                  - $ref: "#/components/schemas/CommandOutcome"
        "422":
          description: Invalid request or command outcome `failed` with InvalidRequest
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InterfaceErrorBody"
                  - $ref: "#/components/schemas/CommandOutcome"
        "429":
          description: |
            Principal quota or command `resourceExhausted`. `Retry-After` is
            ceil(retry_after_ms/1000) seconds (minimum 1). Prefer body
            `retryAfterMs` / outcome fields when present for sub-second intent.
          headers:
            Retry-After:
              description: |
                Integer seconds; sub-second ms hints round up to at least 1.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InterfaceErrorBody"
                  - $ref: "#/components/schemas/CommandOutcome"
        "500":
          description: Internal error or command outcome `failed` (non-InvalidRequest)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InterfaceErrorBody"
                  - $ref: "#/components/schemas/CommandOutcome"
        "503":
          description: |
            Retryable command failure (`retryableFailure`). Always sets
            `Retry-After: 1` — fixed default; outcome has no retry_after_ms field.
          headers:
            Retry-After:
              description: Seconds to wait (fixed default 1)
              schema: { type: integer, minimum: 1, const: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOutcome"
  /v1/checkpoints:
    post:
      operationId: saveCheckpoint
      tags: [recovery]
      summary: Persist workflow checkpoint
      description: Requires `recovery:write`. Pass evidenceRefs; never author evidence.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint]
              properties:
                checkpoint:
                  $ref: "#/components/schemas/WorkflowCheckpoint"
                evidenceRefs:
                  type: array
                  maxItems: 128
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Saved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/recovery/{workflow}:
    get:
      operationId: getRecoveryStatus
      tags: [recovery]
      summary: Checkpoint and receipts
      description: Requires `recovery:read`.
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: RecoveryStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: recoverWorkflow
      tags: [recovery]
      summary: Recover workflow
      description: Requires `recovery:write`. `needsReconciliation` → HTTP 409.
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: RecoveryDecision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/events:
    get:
      operationId: readEvents
      tags: [events]
      summary: Read events
      description: |
        Requires `session:read`. Query `after` and `limit` (max 256).
        Pass `stream=1` for SSE (`text/event-stream`); otherwise JSON
        `EventBatch`. Cursor gaps return **409** with an event-gap body.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 256 }
        - name: stream
          in: query
          schema: { type: string, enum: ["1"] }
          description: When set to "1", response is SSE instead of EventBatch JSON
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: EventBatch JSON, or SSE stream when stream=1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatch"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames; event `id` is the cursor. Idle heartbeats and
                  terminal `event.gap` close the stream.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/DeadlineExceeded"
        "409":
          description: Event cursor gap (history lost / invalid cursor or limit)
          content:
            application/json:
              schema:
                type: object
                required: [error, gap]
                properties:
                  error:
                    $ref: "#/components/schemas/InterfaceError"
                  gap:
                    $ref: "#/components/schemas/EventGap"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/artifacts/{id}:
    get:
      operationId: readArtifact
      tags: [artifacts]
      summary: Read artifact bytes
      description: |
        Requires `artifact:read`. Range requests are rejected (422
        unsupportedOperation). Id must be 1–128 chars of hex or `-`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ArtifactId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: Artifact bytes (Content-Type from store)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/DeadlineExceeded"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs:
    post:
      operationId: submitJob
      tags: [jobs]
      summary: Submit scheduled job
      description: Requires `job:submit`.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJobRequest"
            examples:
              normal:
                value:
                  name: crawl
                  payload: {}
                  priority: normal
                  maxRetries: 3
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/jobs/{job}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job status
      description: Requires `job:read`.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel job
      description: Requires `job:cancel`.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "200":
          description: Updated job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/principals:
    post:
      operationId: issuePrincipal
      tags: [principals]
      summary: Issue scoped bearer
      description: |
        Requires `authority:admin`. Returns 201 with one-time bearer.
        Issued capabilities must be a non-empty subset of the issuer's, must
        not include `authority:admin`, and TTL is capped at 90 days.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId, capabilities, expiresAt]
              additionalProperties: false
              properties:
                principalId: { type: string, format: uuid }
                capabilities:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/Capability"
                  description: |
                    Non-empty subset of the issuer's capabilities. Must not
                    include `authority:admin` (422).
                expiresAt:
                  type: string
                  format: date-time
                  description: Must be ≤ now + 90 days
      responses:
        "201":
          description: Issued (bearer is one-time; capture immediately)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPrincipal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/DeadlineExceeded"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/principals/{principal}:
    delete:
      operationId: revokePrincipal
      tags: [principals]
      summary: Revoke principal
      description: Requires `authority:admin`.
      parameters:
        - name: principal
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/InterfaceVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Deadline"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/mcp:
    post:
      operationId: postMcp
      tags: [mcp]
      summary: MCP JSON-RPC (streamable HTTP)
      description: |
        Bearer-only auth (no x-interface-version / x-correlation-id /
        x-deadline). Body is a JSON-RPC 2.0 request. Prefer this surface for
        tool discovery (`tools/list`) over hand-building CommandEnvelope.
        See MCP over HTTP and MCP tools docs.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 request
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Accepted with no JSON-RPC response body
        "400":
          description: JSON parse error (-32700)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: getMcp
      tags: [mcp]
      summary: MCP SSE notification channel
      description: |
        Bearer-only auth. Server-sent events for
        `notifications/bobby/event` and `tools/list_changed` on capability
        rotation; idle keep-alive comments about every 15s.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap or issued principal bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
      description: "Bearer <token>"
    InterfaceVersion:
      name: x-interface-version
      in: header
      required: true
      schema: { type: string }
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema: { type: string, format: uuid, maxLength: 64 }
    Deadline:
      name: x-deadline
      in: header
      required: true
      schema: { type: string, format: date-time }
      description: RFC3339; after now and within 5 minutes ahead
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    SessionId:
      name: session
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageId:
      name: page
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      name: workflow
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Authentication failed or token expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    Forbidden:
      description: Missing capability or malformed scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    NotFound:
      description: Not found or not owned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    Conflict:
      description: Idempotency conflict or needs reconciliation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    InvalidRequest:
      description: Invalid request (422) or oversized (413)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    TooManyRequests:
      description: |
        Principal quota or resource exhaustion. `Retry-After` is integer
        seconds: ceil(retryAfterMs/1000), minimum 1 when a ms hint is present.
      headers:
        Retry-After:
          description: |
            Integer seconds after rounding up from milliseconds (minimum 1).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    DeadlineExceeded:
      description: Request deadline (`x-deadline`) elapsed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InterfaceErrorBody"
  schemas:
    Capability:
      type: string
      description: Wire capability string (unknown values → 422)
      enum:
        - session:read
        - session:write
        - page:read
        - page:write
        - browser:mutate
        - file:upload
        - file:download
        - javascript:evaluate
        - intent:execute
        - vision:assist
        - artifact:read
        - artifact:capture
        - recovery:read
        - recovery:write
        - job:submit
        - job:read
        - job:cancel
        - authority:admin
        - browser:fingerprint
        - browser:humanize
    ArtifactId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[0-9a-fA-F-]+$"
      description: Artifact id — ASCII hex digits and hyphens only
    OpenPageRequest:
      type: object
      required: [session_id]
      description: |
        HTTP open-page body. Only `session_id` (snake_case). Navigate via
        commands/MCP after open.
      properties:
        session_id: { type: string, format: uuid }
    IssuedPrincipal:
      type: object
      required: [bearer, principalId, capabilities, expiresAt]
      additionalProperties: false
      properties:
        bearer:
          type: string
          description: One-time secret; not retrievable again
        principalId: { type: string, format: uuid }
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        expiresAt: { type: string, format: date-time }
    EventBatch:
      type: object
      required: [events, latestAvailable]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        latestAvailable:
          type: integer
          minimum: 0
          description: EventCursor (u64)
    Event:
      type: object
      required: [cursor, kind, payload]
      properties:
        cursor: { type: integer, minimum: 0 }
        kind: { type: string }
        payload: {}
    EventGap:
      type: object
      required: [reason, earliestAvailable]
      properties:
        reason:
          type: string
          enum: [historyLost, invalidLimit, invalidCursor]
        earliestAvailable: { type: integer, minimum: 0 }
    InterfaceErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/InterfaceError"
    InterfaceError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        retryAfterMs: { type: integer, minimum: 0 }
        layer: { type: string }
    RuntimeInfo:
      type: object
      additionalProperties: true
    SessionState:
      type: object
      additionalProperties: true
    PageState:
      type: object
      additionalProperties: true
    FormSnapshot:
      type: object
      additionalProperties: true
    CommandEnvelope:
      type: object
      required:
        [schemaVersion, commandId, workflowId, attemptId, sessionId, deadline, command]
      additionalProperties: true
      description: |
        Wire envelope for POST /v1/commands. Server deserializes into the Rust
        CommandEnvelope; unknown top-level fields are ignored by serde today,
        but required fields below are mandatory. Prefer MCP named tools over
        hand-building envelopes.
      properties:
        schemaVersion: { type: integer, const: 2 }
        commandId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        pageId:
          type: [string, "null"]
          format: uuid
        deadline: { type: string, format: date-time }
        command:
          type: object
          description: "{ kind: primitive|intent, input: … }"
          required: [kind, input]
          properties:
            kind: { type: string, enum: [primitive, intent] }
            input: { type: object }
    CommandOutcome:
      type: object
      additionalProperties: true
    WorkflowCheckpoint:
      type: object
      additionalProperties: true
    RecoveryStatus:
      type: object
      additionalProperties: true
    RecoveryDecision:
      type: object
      additionalProperties: true
    CreateSessionRequest:
      type: object
      required: [profile]
      properties:
        profile: { type: string }
        proxy: { type: [string, "null"] }
        executionPolicy:
          type: object
          properties:
            javascriptEvaluation: { type: boolean }
            visionAssist: { type: boolean }
            fingerprint: { type: boolean }
            humanize: { type: boolean }
    SubmitJobRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: |
        Builtin handlers today are `echo` and `sleep`. `sleep` payload ms is
        capped at 30_000. Other names fail closed unless a custom handler is
        registered on the scheduler.
      properties:
        name: { type: string }
        payload:
          description: Unconstrained JSON; handler-specific (echo/sleep builtins)
        priority:
          type: string
          enum: [low, normal, high, critical]
          default: normal
        maxRetries: { type: integer, minimum: 0, default: 3 }
        timeoutMs: { type: integer, minimum: 1 }
    JobSubmitResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string }
    JobStatusResponse:
      type: object
      additionalProperties: true
