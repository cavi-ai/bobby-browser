# bobby-browser configuration
#
# This file mirrors the `AppConfig` schema defined in `crates/config/src/lib.rs`.
# It is loaded by `bobby serve` via `AppConfig::load`:
#   - the path is read from the `BOBBY_BROWSER_CONFIG` env var, defaulting to
#     `./config.toml` (this file) if unset;
#   - if the file does not exist, built-in defaults (`AppConfig::default()`)
#     are used instead — a missing config file is not an error.
#
# Bootstrap credentials are never stored here. Use `bobby init`, process env
# (`AUTOMATION_RUNTIME_BOOTSTRAP_*`), or `BOBBY_BROWSER_BOOTSTRAP_ENV` for the
# secret file path.
#
# The values below are exactly `AppConfig::default()`. Uncomment/edit fields
# to override; any field you omit falls back to its own default.

[server]
# Bind address and port for the broker's HTTP interface.
host = "127.0.0.1"
port = 7777

[browser]
# Directory holding per-profile browser state.
profiles_dir = "./data/profiles"
# Run browsers headless (no visible window).
headless = true
# Maximum number of concurrently active browser workers.
max_active = 8
# Filesystem roots that file-upload inputs are allowed to read from.
upload_roots = ["./data/uploads"]
# Directory browser downloads are written to.
downloads_dir = "./data/downloads"
# Directory for other browser-produced artifacts (e.g. screenshots).
artifacts_dir = "./data/artifacts"
# Maximum size, in bytes, of a single stored artifact.
max_artifact_bytes = 8388608
# Maximum width/height, in pixels, of a captured screenshot.
max_screenshot_dimension = 16384
# Maximum size, in bytes, of a JavaScript evaluation result before it is
# truncated (see `js_engine::bound_result`).
max_js_result_bytes = 65536
# Hard upper bound, in milliseconds, on a single JavaScript evaluation's
# timeout_ms. Requests exceeding this are clamped, not rejected, so a caller
# cannot pin a worker lease open indefinitely with an unbounded timeout.
max_js_timeout_ms = 30000

[storage]
# Append-only command journal.
journal_path = "./data/storage/commands.jsonl"
# Directory holding periodic journal checkpoints.
checkpoints_dir = "./data/storage/checkpoints"
# Authority (credential) record storage.
authority_path = "./data/storage/authority.json"

[http]
# Whether outbound HTTP requests may target loopback addresses.
allow_loopback = false
# Whether outbound HTTP requests may target private/internal networks.
allow_private_network = false
# Maximum redirects followed per outbound request.
max_redirects = 5
# Maximum total response header size, in bytes.
max_header_bytes = 65536
# Maximum request body size, in bytes.
max_body_bytes = 8388608
# Maximum download size, in bytes.
max_download_bytes = 67108864
# Per-request timeout, in milliseconds.
request_timeout_ms = 30000
# Maximum number of outbound HTTP requests in flight at once.
max_concurrent_requests = 8

[vision]
provider = "mlx"
collect_training_data = false
training_data_dir = "data/vision"

[vision.providers]

[vision.providers.mlx]
base_url = "http://127.0.0.1:9101"
model = "mlx-community/Qwen2.5-VL-3B-Instruct-4bit"
# ACP harness example (OAuth stays in the harness):
# backend = "acp"
# profile = "codex"
# [vision.acp_profiles.codex]
# command = "codex"
# args = ["acp"]
# auth = "advertised"
#
# Vision-assist provider (disabled when endpoint_url is unset).
#
# Preferred setup:
#   bobby vision connect          # writes provider profile + loopback endpoint
#   export BOBBY_VISION_TOKEN=…   # loopback bearer (never stored in this file)
#   export OPENAI_API_KEY=…       # only when the profile sets api_key_env
#   bobby serve --vision          # auto-spawns loopback vision-proxy when needed
#
# Manual two-process setup still works:
#   bobby vision-proxy            # default http://127.0.0.1:9100/vision
#
# endpoint_url = "http://127.0.0.1:9100/vision"
# token_env = "BOBBY_VISION_TOKEN"
# provider = "lmstudio"
# timeout_ms = 15000
#
# [vision.providers.openai]
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"
#
# [vision.providers.lmstudio]
# base_url = "http://127.0.0.1:1234/v1"   # use the URL LM Studio shows (port often 1234)
# model = "local-model"
#
# [vision.providers.ollama]
# base_url = "http://127.0.0.1:11434/v1"
# model = "llava"

[cdp]
# Authenticated Chromium DevTools discovery and WebSockets, on a dedicated TCP
# listener. `bobby cdp` turns this on for one run; `bobby serve` honours the
# value below.
enabled = false
host = "127.0.0.1"
# 9222 is also Firefox's default remote-debugging port. `bobby doctor` reports
# the collision as `cdp-port`; override with `bobby cdp --cdp-port <port>`.
port = 9222
# Open a runtime page for a connecting client that holds session:write and
# page:write and has no session yet. CDP cannot create a session itself, so
# with this off a connected client has nothing to drive until one is opened
# over HTTP, MCP, or an SDK.
auto_session = true

[interface]
# Maximum size, in bytes, of a single interface request.
max_request_bytes = 1048576
# Maximum number of events returned in one event-batch read.
max_event_batch = 256
# Maximum number of events retained per session for replay.
max_event_retention = 16384
# Maximum number of concurrent interface connections.
max_connections = 64
# Worker pool size for rejecting/failing requests.
max_rejection_workers = 16
# Where issued principal/authority records are persisted.
token_records_path = "./data/storage/authorities.json"
# Maximum number of enrolled principals.
max_principals = 16
# Maximum requests in flight per principal at once.
max_in_flight_per_principal = 8

[nodes]

[nodes.vision]
kind = "vision"
endpoint_url = "http://127.0.0.1:9100/vision"
token_env = "BOBBY_VISION_TOKEN"
